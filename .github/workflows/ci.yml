name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]  # windows = portability check (§18.2)
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: core/rust } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  flutter:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app/flutter_ui } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
  docs-and-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -c "import json,glob;[json.load(open(f)) for f in glob.glob('schemas/*.json')]"
      - run: python3 -c "import yaml;yaml.safe_load(open('fixtures/manifest.yaml'))"
  windows-impact:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - env: { PR_BODY: "${{ github.event.pull_request.body }}" }
        run: |
          printf '%s' "$PR_BODY" > /tmp/pr_body.md
          scripts/check_windows_impact.sh "origin/${{ github.base_ref }}" /tmp/pr_body.md

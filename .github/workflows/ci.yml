name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]  # windows = portability check (§18.2)
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: core } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim" }
      - run: brew install xcodegen
      - run: scripts/build_apple_core.sh
      - run: scripts/fetch_llama_xcframework.sh
      - run: cd app/apple && xcodegen generate
      - name: macOS unit tests
        run: cd app/apple && xcodebuild -scheme AIVision -destination 'platform=macOS' test CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
      - name: iPadOS build
        run: cd app/apple && xcodebuild -scheme AIVision -destination 'generic/platform=iOS' build CODE_SIGNING_ALLOWED=NO
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,x86_64-linux-android" }
      - uses: nttld/setup-ndk@v1
        id: ndk
        with: { ndk-version: r28b }
      - run: cargo install cargo-ndk --locked
      - run: scripts/build_android_core.sh
        env: { ANDROID_NDK_HOME: "${{ steps.ndk.outputs.ndk-path }}" }
      - run: cd app/android && ./gradlew assembleDebug
  docs-and-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -c "import json,glob;[json.load(open(f)) for f in glob.glob('schemas/*.json')]"
      - run: python3 -I fixtures/tools/verify_fixtures.py
  windows-impact:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - env: { PR_BODY: "${{ github.event.pull_request.body }}" }
        run: |
          printf '%s' "$PR_BODY" > /tmp/pr_body.md
          scripts/check_windows_impact.sh "origin/${{ github.base_ref }}" /tmp/pr_body.md

name: AIVision
options:
  bundleIdPrefix: com.example.aivision
  deploymentTarget: { iOS: "17.0", macOS: "14.0" }
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    INFOPLIST_KEY_NSCameraUsageDescription: "Live Capture reads video from your USB capture card."
targets:
  AIVision:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Sources, Generated/subtitle_ffi.swift]
    dependencies:
      - framework: Generated/SubtitleFFI.xcframework
        embed: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"   # iPad only on iOS (README §1.4)
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  AIVisionTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [Tests]
    dependencies: [{ target: AIVision }]
    settings:
      base:
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/AIVision.app/Contents/MacOS/AIVision"
        "TEST_HOST[sdk=iphone*]": "$(BUILT_PRODUCTS_DIR)/AIVision.app/AIVision"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  AIVision:
    build: { targets: { AIVision: all, AIVisionTests: [test] } }
    test: { targets: [AIVisionTests] }

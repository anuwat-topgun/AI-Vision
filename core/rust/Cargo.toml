[package]
name = "subtitle_core"
version = "0.1.0"
edition = "2021"
description = "Platform-neutral shared core: session epoch, subtitle FSM, contracts, cache keys (README §4, §19.1)"
license = "UNLICENSED"
publish = false

# Invariant §19.1(1): no Apple/Android/Windows SDK dependencies here.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
jsonschema = { version = "0.18", default-features = false }
